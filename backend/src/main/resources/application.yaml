server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dna-amr-screener
    seed-parallelism: ${SPRING_APP_SEED_PARALLELISM:8}
    analyze-parallelism: ${SPRING_APP_ANALYZE_PARALLELISM:8}
    batch-size: ${SPRING_APP_BATCH_SIZE:32}
    session-ttl-seconds: ${SPRING_APP_SESSION_TTL_SECONDS:3600}
  data:
    redis:
      gene:
        host: ${SPRING_DATA_REDIS_GENE_HOST:redis-gene}
        port: ${SPRING_DATA_REDIS_GENE_PORT:6379}
        password: ${SPRING_DATA_REDIS_GENE_PASSWORD:}
        database: ${SPRING_DATA_REDIS_GENE_DATABASE:0}
        timeout: ${SPRING_DATA_REDIS_GENE_TIMEOUT:10s}
        lettuce:
          pool:
            min-idle: ${SPRING_DATA_REDIS_GENE_MIN_IDLE:4}
            max-idle: ${SPRING_DATA_REDIS_GENE_MAX_IDLE:16}
            max-total: ${SPRING_DATA_REDIS_GENE_MAX_TOTAL:32}
      session:
        password: ${SPRING_DATA_REDIS_SESSION_PASSWORD:}
        timeout: ${SPRING_DATA_REDIS_SESSION_TIMEOUT:10s}
        cluster:
          nodes: ${SPRING_DATA_REDIS_SESSION_CLUSTER_NODES:redis-session-1:6379,redis-session-2:6379,redis-session-3:6379}
        lettuce:
          pool:
            min-idle: ${SPRING_DATA_REDIS_SESSION_MIN_IDLE:4}
            max-idle: ${SPRING_DATA_REDIS_SESSION_MAX_IDLE:16}
            max-total: ${SPRING_DATA_REDIS_SESSION_MAX_TOTAL:32}

screener:
  lsh:
    k21:
      kmer-size: ${SCREENER_LSH_K21_KMER_SIZE:21}
      num-hashes: ${SCREENER_LSH_K21_NUM_HASHES:100}
      bands: ${SCREENER_LSH_K21_BANDS:25}
      rows-per-band: ${SCREENER_LSH_K21_ROWS_PER_BAND:4}
    k17:
      kmer-size: ${SCREENER_LSH_K17_KMER_SIZE:17}
      num-hashes: ${SCREENER_LSH_K17_NUM_HASHES:100}
      bands: ${SCREENER_LSH_K17_BANDS:20}
      rows-per-band: ${SCREENER_LSH_K17_ROWS_PER_BAND:5}
    max-reads-per-gene: ${SCREENER_LSH_MAX_READS_PER_GENE:80}
    min-avg-phred: ${SCREENER_LSH_MIN_AVG_PHRED:20.0}

  hit-criteria:
    strict:
      primary:
        min-identity: ${SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_IDENTITY:0.95}
        min-breadth-1x: ${SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_BREADTH_1X:0.80}
        min-breadth-2x: ${SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_BREADTH_2X:0.40}
        min-mean-depth: ${SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_MEAN_DEPTH:5.0}
      secondary:
        min-identity: ${SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_IDENTITY:0.90}
        min-breadth-1x: ${SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_BREADTH_1X:0.80}
        min-breadth-2x: ${SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_BREADTH_2X:0.50}
        min-mean-depth: ${SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_MEAN_DEPTH:8.0}
    relaxed:
      primary:
        min-identity: ${SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_IDENTITY:0.90}
        min-breadth-1x: ${SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_BREADTH_1X:0.70}
        min-breadth-2x: ${SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_BREADTH_2X:0.30}
        min-mean-depth: ${SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_MEAN_DEPTH:3.0}
      secondary:
        min-identity: ${SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_IDENTITY:0.85}
        min-breadth-1x: ${SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_BREADTH_1X:0.75}
        min-breadth-2x: ${SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_BREADTH_2X:0.75}
        min-mean-depth: ${SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_MEAN_DEPTH:5.0}
  number-of-candidates: ${SCREENER_NUMBER_OF_CANDIDATES:149}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.example.dna: ${LOG_LEVEL_APP:INFO}
    io.lettuce: ${LOG_LEVEL_LETTUCE:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"