apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: spring-boot-monitor
  namespace: base
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dna-amr-screener
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s