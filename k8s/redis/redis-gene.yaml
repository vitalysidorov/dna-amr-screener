apiVersion: v1
kind: Service
metadata:
  name: redis-gene
  namespace: base
  labels:
    app: redis-gene
spec:
  clusterIP: None
  selector:
    app: redis-gene
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-gene
  namespace: base
spec:
  serviceName: redis-gene
  replicas: 1
  selector:
    matchLabels:
      app: redis-gene
  template:
    metadata:
      labels:
        app: redis-gene
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "3Gi"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi