apiVersion: redis.redis.opstreelabs.in/v1beta1
kind: RedisCluster
metadata:
  name: my-redis-cluster
  namespace: base
  labels:
    app: redis-cluster
spec:
  clusterSize: 3
  clusterVersion: "v7"
  kubernetesConfig:
    image: mirror.gcr.io/library/redis:7.2-alpine
    imagePullPolicy: IfNotPresent
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"