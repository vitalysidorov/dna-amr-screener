apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-config
  namespace: base
data:
  SERVER_PORT: "8080"

  SPRING_DATA_REDIS_GENE_HOST: "redis-gene.base.svc.cluster.local"
  SPRING_DATA_REDIS_GENE_PORT: "6379"
  SPRING_DATA_REDIS_GENE_DATABASE: "0"
  SPRING_DATA_REDIS_GENE_TIMEOUT: "10s"
  SPRING_DATA_REDIS_GENE_MIN_IDLE: "4"
  SPRING_DATA_REDIS_GENE_MAX_IDLE: "32"
  SPRING_DATA_REDIS_GENE_MAX_TOTAL: "64"

  SPRING_DATA_REDIS_SESSION_CLUSTER_NODES: "my-redis-cluster-leader-0.my-redis-cluster-leader-headless.base.svc.cluster.local:6379,my-redis-cluster-leader-1.my-redis-cluster-leader-headless.base.svc.cluster.local:6379,my-redis-cluster-leader-2.my-redis-cluster-leader-headless.base.svc.cluster.local:6379"
  SPRING_DATA_REDIS_SESSION_TIMEOUT: "10s"
  SPRING_DATA_REDIS_SESSION_MIN_IDLE: "4"
  SPRING_DATA_REDIS_SESSION_MAX_IDLE: "32"
  SPRING_DATA_REDIS_SESSION_MAX_TOTAL: "64"

  SPRING_APP_SEED_PARALLELISM: "16"
  SPRING_APP_ANALYZE_PARALLELISM: "48"
  SPRING_APP_BATCH_SIZE: "64"
  SPRING_APP_SESSION_TTL_SECONDS: "3600"

  SCREENER_LSH_K21_KMER_SIZE: "21"
  SCREENER_LSH_K21_NUM_HASHES: "100"
  SCREENER_LSH_K21_BANDS: "25"
  SCREENER_LSH_K21_ROWS_PER_BAND: "4"

  SCREENER_LSH_K17_KMER_SIZE: "17"
  SCREENER_LSH_K17_NUM_HASHES: "100"
  SCREENER_LSH_K17_BANDS: "20"
  SCREENER_LSH_K17_ROWS_PER_BAND: "5"

  SCREENER_LSH_MAX_READS_PER_GENE: "80"
  SCREENER_LSH_MIN_AVG_PHRED: "20.0"

  SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_IDENTITY: "0.95"
  SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_BREADTH_1X: "0.80"
  SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_BREADTH_2X: "0.40"
  SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_MEAN_DEPTH: "5.0"

  SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_IDENTITY: "0.90"
  SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_BREADTH_1X: "0.80"
  SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_BREADTH_2X: "0.50"
  SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_MEAN_DEPTH: "8.0"

  SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_IDENTITY: "0.90"
  SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_BREADTH_1X: "0.70"
  SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_BREADTH_2X: "0.30"
  SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_MEAN_DEPTH: "3.0"

  SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_IDENTITY: "0.85"
  SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_BREADTH_1X: "0.75"
  SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_BREADTH_2X: "0.75"
  SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_MEAN_DEPTH: "5.0"

  SCREENER_NUMBER_OF_CANDIDATES: "149"

  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"

  LOG_LEVEL_APP: "INFO"
  LOG_LEVEL_LETTUCE: "WARN"