apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: client
  namespace: base
spec:
  secretName: client-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: client-agent-01
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: client-ca-issuer
    kind: Issuer