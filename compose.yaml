services:
  redis-gene:
    image: mirror.gcr.io/library/redis:7.2-alpine
    container_name: redis-gene
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 2gb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - gene-data:/data
    networks:
      - dna-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  redis-session-1:
    image: mirror.gcr.io/library/redis:7.2-alpine
    container_name: redis-session-1
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly no
      --save ""
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - session1-data:/data
    networks:
      - dna-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  redis-session-2:
    image: mirror.gcr.io/library/redis:7.2-alpine
    container_name: redis-session-2
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly no
      --save ""
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - session2-data:/data
    networks:
      - dna-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  redis-session-3:
    image: mirror.gcr.io/library/redis:7.2-alpine
    container_name: redis-session-3
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly no
      --save ""
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - session3-data:/data
    networks:
      - dna-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  redis-session-init:
    image: mirror.gcr.io/library/redis:7.2-alpine
    container_name: redis-session-init
    depends_on:
      redis-session-1:
        condition: service_healthy
      redis-session-2:
        condition: service_healthy
      redis-session-3:
        condition: service_healthy
    networks:
      - dna-net
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "Checking cluster state..."
        if redis-cli -h redis-session-1 cluster info 2>/dev/null | grep -q "cluster_state:ok"; then
          echo "Cluster already OK — skip create"
          exit 0
        fi
        echo "Resetting nodes and creating cluster..."
        for h in redis-session-1 redis-session-2 redis-session-3; do
          redis-cli -h $$h FLUSHALL || true
          redis-cli -h $$h CLUSTER RESET HARD || true
        done
        sleep 2
        yes yes | redis-cli --cluster create \
          redis-session-1:6379 \
          redis-session-2:6379 \
          redis-session-3:6379 \
          --cluster-replicas 0
        echo "Cluster created"
        redis-cli -h redis-session-1 cluster info

  app:
    build: .
    container_name: dna-amr-screener
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_GENE_HOST: redis-gene
      SPRING_DATA_REDIS_GENE_PORT: "6379"
      SPRING_DATA_REDIS_GENE_DATABASE: "0"
      SPRING_DATA_REDIS_GENE_TIMEOUT: "10s"
      SPRING_DATA_REDIS_GENE_MIN_IDLE: "4"
      SPRING_DATA_REDIS_GENE_MAX_IDLE: "32"
      SPRING_DATA_REDIS_GENE_MAX_TOTAL: "64"

      SPRING_DATA_REDIS_SESSION_CLUSTER_NODES: "redis-session-1:6379,redis-session-2:6379,redis-session-3:6379"
      SPRING_DATA_REDIS_SESSION_TIMEOUT: "10s"
      SPRING_DATA_REDIS_SESSION_MIN_IDLE: "4"
      SPRING_DATA_REDIS_SESSION_MAX_IDLE: "32"
      SPRING_DATA_REDIS_SESSION_MAX_TOTAL: "64"

      SPRING_APP_SEED_PARALLELISM: "16"
      SPRING_APP_ANALYZE_PARALLELISM: "48"
      SPRING_APP_BATCH_SIZE: "64"
      SPRING_APP_SESSION_TTL_SECONDS: "3600"

      SCREENER_LSH_K21_KMER_SIZE: "21"
      SCREENER_LSH_K21_NUM_HASHES: "100"
      SCREENER_LSH_K21_BANDS: "25"
      SCREENER_LSH_K21_ROWS_PER_BAND: "4"

      SCREENER_LSH_K17_KMER_SIZE: "17"
      SCREENER_LSH_K17_NUM_HASHES: "100"
      SCREENER_LSH_K17_BANDS: "20"
      SCREENER_LSH_K17_ROWS_PER_BAND: "5"

      SCREENER_LSH_MAX_READS_PER_GENE: "80"
      SCREENER_LSH_MIN_AVG_PHRED: "20.0"

      SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_IDENTITY: "0.95"
      SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_BREADTH_1X: "0.80"
      SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_BREADTH_2X: "0.40"
      SCREENER_HIT_CRITERIA_STRICT_PRIMARY_MIN_MEAN_DEPTH: "5.0"

      SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_IDENTITY: "0.90"
      SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_BREADTH_1X: "0.80"
      SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_BREADTH_2X: "0.50"
      SCREENER_HIT_CRITERIA_STRICT_SECONDARY_MIN_MEAN_DEPTH: "8.0"

      SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_IDENTITY: "0.90"
      SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_BREADTH_1X: "0.70"
      SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_BREADTH_2X: "0.30"
      SCREENER_HIT_CRITERIA_RELAXED_PRIMARY_MIN_MEAN_DEPTH: "3.0"

      SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_IDENTITY: "0.85"
      SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_BREADTH_1X: "0.75"
      SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_BREADTH_2X: "0.75"
      SCREENER_HIT_CRITERIA_RELAXED_SECONDARY_MIN_MEAN_DEPTH: "5.0"

      SCREENER_NUMBER_OF_CANDIDATES: "149"

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"

      LOG_LEVEL_APP: "INFO"
      LOG_LEVEL_LETTUCE: "WARN"

    depends_on:
      redis-gene:
        condition: service_healthy
      redis-session-1:
        condition: service_healthy
      redis-session-2:
        condition: service_healthy
      redis-session-3:
        condition: service_healthy
      redis-session-init:
        condition: service_completed_successfully
    networks:
      - dna-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  gene-data:
  session1-data:
  session2-data:
  session3-data:

networks:
  dna-net:
    driver: bridge